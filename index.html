<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="icon.png">
  <title>ICT 0417</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 2rem 3rem;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      width: 70%;    /* relative to screen */
      max-width: 2000px; /* upper limit */
    }
    h1 {
      margin-top: 0;
      color: #333;
    }
    .folders {
      display: flex;
      justify-content: space-around;
      margin-top: 2rem;
    }
    .folder {
      flex: 1;
      margin: 0 1rem;
    }
    .folder h2 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin: 0.5rem 0;
    }
    a {
      text-decoration: none;
      color: #0073e6;
      font-weight: bold;
    }
    a:hover {
      color: #005bb5;
    }
    .folder-icon {
      font-size: 2rem;
      display: block;
      margin-bottom: 0.5rem;
    }

    /* --- New TikTok Footer Styles --- */
    .social-footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid #eee;
    }
    .slogan {
      color: #666;
      font-style: italic;
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }
    .tiktok-btn {
      display: inline-block;
      background-color: #000;
      color: white !important; /* Force white text */
      padding: 10px 25px;
      border-radius: 50px;
      font-weight: normal;
      transition: all 0.2s ease;
    }
    .tiktok-btn:hover {
      background-color: #333;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome</h1>
    <p>You can find your ICT resources here:</p>

    <div class="folders">
      <div class="folder">
        <span class="folder-icon">📚</span>
        <h2>Slides</h2>
        <ul>
          <li><a href="Ch1.pdf" target="_blank">Chapter 1</a></li>
          <li><a href="Ch2.pdf" target="_blank">Chapter 2</a></li>
          <li><a href="Ch3.pdf" target="_blank">Chapter 3</a></li>
          <li><a href="Ch4.pdf" target="_blank">Chapter 4</a></li>
          <li><a href="Ch5.pdf" target="_blank">Chapter 5</a></li>
        </ul>
      </div>
      <div class="folder">
        <span class="folder-icon">📘</span>
        <h2>Material</h2>
        <ul>
          <li><a href="BOK.pdf" target="_blank">Book</a></li>
          <li><a href="0417S.pdf" target="_blank">Syllabus</a></li>
        </ul>
      </div>
       <div class="folder">
        <span class="folder-icon">❓</span>
        <h2>Questions</h2>
        <ul>
          <li><a href="QPC1.pdf" target="_blank">Chapter 1</a></li>
          <li><a href="QPC2.pdf" target="_blank">Chapter 2</a></li>
          <li><a href="QPC3.pdf" target="_blank">Chapter 3</a></li>
          <li><a href="QPC4.pdf" target="_blank">Chapter 4</a></li>
          <li><a href="QPC5.pdf" target="_blank">Chapter 5</a></li>
        </ul>
      </div>
    </div>

    <div class="social-footer">
      <p class="slogan">Learn fast. Scroll smart.</p>
      <a href="https://www.tiktok.com/@projectdoomscroll" target="_blank" class="tiktok-btn">
        ♪ Find us on TikTok ♪
      </a>
    </div>

  </div>
</body>
</html>
